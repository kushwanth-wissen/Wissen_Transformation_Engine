project: wissen_transformation_studio

sources:
  - type: "csv"
    enabled: true
    path_list:
      - "data/input/sales_data_sample.csv"
      - "data/input/student.csv"
    header: true
    infer_schema: true

  - type: "mysql"
    enabled: true
    # Use credentials from env file instead of a credentials JSON file
    credentials_env: ".env"
    query: "select * from employees"
    header: true

  - type: "mongodb"
    enabled: true
    # Use credentials from env file (set MONGO_URI or MONGO_HOST/PORT/DB in .env)
    credentials_env: ".env"
    collection: "student_data"
    dynamic_schema: true
    header: true

  - type: "json"
    enabled: true
    path_list:
      - "data/input/sample1.json"
      - "data/input/sample2.json"
    multiline: true

  - type: "api"
    enabled: true
    name: "market_data_api"
    url: "https://api.countrylayer.com/v2/all"
    method: "GET"
    # params:
    #   symbols: "AAPL"
    #   limit: 100
    auth:
      type: "api_key"
      in: "params"
      param_name: "access_key"
      value: "8979cc3923d9469b309b7abd711cbb49"
    pagination:
      enabled: true
      type: "page"
      page_param: "offset"
      start: 0
      increment: 1
      page_size_param: "limit"
      page_size: 100
      max_pages: 5
    rate_limit:
      enabled: true
      delay_seconds: 1.0

data_transformations:
  duplicate_handling:
    enabled: true
    subset: []
    keep: "first"

destination:
  - type: "local"
    base_path: "data/output/"
    format: "parquet"
    mode: "overwrite"
    naming_pattern: "{filename}_{current_date}.{format}"
    timestamp_format: "%Y%m%d"

  - type: "ADLSGen2"
    account_name: "your_account_name"
    container_name: "your_container_name"
    directory_path: "transformed_data/"
    format: "parquet"
    mode: "overwrite"
    naming_pattern: "{filename}_{current_date}.{format}"
    timestamp_format: "%Y%m%d"

  - type: "s3"
    bucket_name: "your-bucket-name"
    directory_path: "transformed_data/"
    format: "parquet"
    mode: "overwrite"
    naming_pattern: "{filename}_{current_date}.{format}"
    timestamp_format: "%Y%m%d"

  - type: "GCS"
    bucket_name: "your-gcs-bucket"
    directory_path: "transformed_data/"
    format: "parquet"
    mode: "overwrite"
    naming_pattern: "{filename}_{current_date}.{format}"
    timestamp_format: "%Y%m%d"